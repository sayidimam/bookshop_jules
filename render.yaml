databases:
  - name: bookshop_db
    databaseName: bookshop
    user: jules
    plan: free

services:
  - type: web
    name: bookshop_backend
    env: python
    region: singapore
    plan: free
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: bookshop_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
